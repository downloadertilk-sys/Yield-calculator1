
name: Build TaungThuEain Crop Yield Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check Android project structure
        run: |
          echo "Checking project structure..."
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          echo "Project structure OK"

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TaungThuEain-CropYield-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
