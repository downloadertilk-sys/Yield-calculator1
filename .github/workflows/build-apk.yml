
name: Build KoSai Crop Yield Calculator APK From ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" \
            ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/kosai_project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/kosai_project"

          PROJECT_DIR=""

          while IFS= read -r -d '' SETTINGS; do
            DIR=$(dirname "$SETTINGS")

            if [ -f "$DIR/app/build.gradle" ] || \
               [ -f "$DIR/app/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find "$RUNNER_TEMP/kosai_project" \
            -type f \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) -print0)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            find "$RUNNER_TEMP/kosai_project" -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Check Android project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          test -f app/src/main/AndroidManifest.xml

          if [ ! -f app/build.gradle ] && \
             [ ! -f app/build.gradle.kts ]; then
            echo "App Gradle file missing"
            exit 1
          fi

          echo "Android project structure OK"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle --no-daemon assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KoSai-CropYield-Calculator-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
